<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Introduction Cutscene</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#3AD7FF; }
  canvas { display:block; }
  /* Keep the SVG available for texture loading (but invisible). */
  #mezzaSvg { display:none; position:fixed; left:-99999px; top:-99999px; width:1024px; height:auto; }
</style>
</head>
<body>

<!-- This SVG becomes the texture on the bisecting plane -->
<svg
   version="1.1"
   id="mezzaSvg"
   width="1501.0909"
   height="2001.4545"
   viewBox="0 0 1501.0909 2001.4545"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs1" />
  <g
     id="g1">
    <image
       width="1501.0909"
       height="2001.4545"
       preserveAspectRatio="none"
       style="image-rendering:optimizeQuality"
       xlink:href="./images/mezza_beginning.png"
       id="image1" />
  </g>
</svg>

<script type="module">
  import * as THREE from "./vendor/three.module.js";

  // Optional, but handy for debugging:
  // import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

  const BG = 0x3AD7FF;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.localClippingEnabled = true;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(BG, 1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(BG, 2.8, 12.5);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
  camera.position.set(0, 0, 3.2);

  // const controls = new OrbitControls(camera, renderer.domElement);
  // controls.enableDamping = true;

  // --- Lights (soft, “bio” feeling) ---
  scene.add(new THREE.AmbientLight(0xffffff, 0.65));

  const key = new THREE.DirectionalLight(0xffffff, 0.9);
  key.position.set(2.5, 2.0, 3.0);
  scene.add(key);

  const fill = new THREE.DirectionalLight(0xffffff, 0.35);
  fill.position.set(-2.0, -1.0, 2.5);
  scene.add(fill);

  // --- Hallway floor (lit by same scene lights) ---
  const hallwayFloorMat = new THREE.MeshStandardMaterial({
    color: 0xf5f5f5,
    roughness: 0.25,
    metalness: 0.0,
    emissive: 0x2a2a2a,
  });
  const floorGroup = new THREE.Group();
  const floorY = -1.15;
  const floorThickness = 0.18;
  const floorNearZ = 1.5;
  const floorFarZ = -170;
  const corridorWidth = 4;
  const cellSize = 0.4;
  const cols = Math.floor(corridorWidth / cellSize);
  const rows = Math.ceil((floorNearZ - floorFarZ) / cellSize);
  const startX = -corridorWidth * 0.5 + cellSize * 0.5;
  const cellGeo = new THREE.BoxGeometry(cellSize, floorThickness, cellSize);

  // Hole density changes in random bands so cutouts occur at random intervals.
  let bandRowsLeft = 0;
  let bandHoleChance = 0.2;
  for (let row = 0; row < rows; row += 1) {
    if (bandRowsLeft <= 0) {
      bandRowsLeft = 4 + Math.floor(Math.random() * 14);
      bandHoleChance = 0.14 + Math.random() * 0.12; // keeps rows near ~80/20 material-to-holes
    }
    bandRowsLeft -= 1;

    const z = floorNearZ - row * cellSize;
    for (let col = 0; col < cols; col += 1) {
      if (Math.random() < bandHoleChance) continue; // square cutout
      const cell = new THREE.Mesh(cellGeo, hallwayFloorMat);
      cell.position.set(startX + col * cellSize, floorY - floorThickness * 0.5, z);
      floorGroup.add(cell);
    }
  }
  scene.add(floorGroup);

  // --- Egg shell (translucent for now) ---
  // NOTE: true transmission looks best on newer Three versions + proper tone mapping;
  // This setup is intentionally simple and stable.
  const eggGeo = new THREE.SphereGeometry(1, 96, 96);
  // “Eggify” it: slightly taller, slightly narrower
  eggGeo.scale(0.9, 1.25, 0.9);

  // Chicken-egg profile: wider at the bottom, narrower at the top.
  const pos = eggGeo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    // Normalize y to 0..1 (bottom..top) based on radius 1
    const t = (v.y + 1) * 0.5;
    const bottomScale = 1.15;
    const topScale = 0.72;
    const s = bottomScale + (topScale - bottomScale) * t;
    v.x *= s;
    v.z *= s;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  pos.needsUpdate = true;
  eggGeo.computeVertexNormals();

  const eggMat = new THREE.MeshPhysicalMaterial({
    color: 0xfafafa,
    roughness: 0.2,
    metalness: 0.0,
    transparent: false,
    opacity: 1.0,

    // Soft highlights:
    specularIntensity: 0.9,
    clearcoat: 0.2,
    clearcoatRoughness: 0.2,
    emissive: 0x111111,
  });

  // Half-shell cut: vertical plane through the egg's center (keeps x >= 0).
  const halfCut = new THREE.Plane(new THREE.Vector3(1, 0, 0), 0);
  eggMat.clippingPlanes = [halfCut];

  const egg = new THREE.Mesh(eggGeo, eggMat);

  // Shell thickness: inner surface slightly scaled down, rendered backfaces.
  const innerGeo = eggGeo.clone();
  innerGeo.scale(0.92, 0.92, 0.92);
  const innerMat = eggMat.clone();
  innerMat.side = THREE.BackSide;
  innerMat.clippingPlanes = [halfCut];
  const inner = new THREE.Mesh(innerGeo, innerMat);

  // Group so the shell rotates together.
  const shell = new THREE.Group();
  shell.add(egg);
  shell.add(inner);
  shell.scale.set(0.5335, 0.5335, 0.5335);
  shell.position.y = 0.06;

  function makeEggCutRingShape(segments = 240) {
    const outer = [];
    const inner = [];
    const yScale = 1.25;
    const xzScale = 0.9;
    const taperBase = 0.935;
    const taperSlope = 0.26875;
    const innerScale = 0.92;

    for (let i = 0; i <= segments; i++) {
      const a = -Math.PI * 0.5 + (Math.PI * i / segments);
      const sy = Math.sin(a);
      const cy = Math.cos(a);
      const y = yScale * sy;
      const taper = taperBase - taperSlope * sy;
      const z = xzScale * taper * cy;
      outer.push(new THREE.Vector2(z, y));
      inner.push(new THREE.Vector2(z * innerScale, y * innerScale));
    }

    const shape = new THREE.Shape();
    shape.moveTo(outer[0].x, outer[0].y);
    for (let i = 1; i < outer.length; i++) shape.lineTo(outer[i].x, outer[i].y);
    for (let i = outer.length - 1; i >= 0; i--) shape.lineTo(-outer[i].x, outer[i].y);
    shape.closePath();

    const hole = new THREE.Path();
    hole.moveTo(inner[0].x, inner[0].y);
    for (let i = 1; i < inner.length; i++) hole.lineTo(inner[i].x, inner[i].y);
    for (let i = inner.length - 1; i >= 0; i--) hole.lineTo(-inner[i].x, inner[i].y);
    hole.closePath();
    shape.holes.push(hole);

    return shape;
  }

  const cutFaceGeo = new THREE.ShapeGeometry(makeEggCutRingShape(), 128);
  cutFaceGeo.rotateY(Math.PI * 0.5);
  const cutFaceMat = new THREE.MeshStandardMaterial({
    color: 0xf6f1df,
    roughness: 0.72,
    metalness: 0.0,
    side: THREE.DoubleSide,
  });
  const cutFace = new THREE.Mesh(cutFaceGeo, cutFaceMat);
  cutFace.position.x = 0.0008;
  shell.add(cutFace);
  scene.add(shell);

  // --- Bisecting plane: the SVG sits on a plane that cuts the egg in half ---
  // Toggle whether to use/load the inline SVG source.
  const USE_INLINE_MEZZA_SVG = false;
  // We serialize the inline SVG to an in-memory image only when enabled.
  let mezzaSvg = null;
  const inlineMezzaSvg = document.getElementById("mezzaSvg");
  if (USE_INLINE_MEZZA_SVG) mezzaSvg = inlineMezzaSvg;
  else if (inlineMezzaSvg) inlineMezzaSvg.remove();

  let mezzaPlane = null;
  let mezzaGroup = null;
  const shardPlanes = [];
  const shardMotion = [];
  const mediumShardSpeed = 0.6;

  function makeTextureFromImage(imgEl) {
    // Draw the image into a canvas, then use that as a Three texture.
    const w = imgEl.naturalWidth || 1024;
    const h = imgEl.naturalHeight || 1024;

    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    const ctx = c.getContext("2d");

    // Transparent background; draw the SVG as-is
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(imgEl, 0, 0, w, h);

    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    tex.needsUpdate = true;
    return { tex, w, h };
  }

  function svgToImage(svgEl) {
    return new Promise((resolve, reject) => {
      const svgText = new XMLSerializer().serializeToString(svgEl);
      const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const img = new Image();

      img.onload = () => {
        URL.revokeObjectURL(url);
        resolve(img);
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error("Failed to load inline SVG as image."));
      };
      img.src = url;
    });
  }

  async function buildMezzaPlane() {
    let tex = null;
    let aspect = 1501.0909 / 2001.4545; // original Mezza SVG aspect
    if (USE_INLINE_MEZZA_SVG && mezzaSvg) {
      const mezzaImg = await svgToImage(mezzaSvg);
      const texInfo = makeTextureFromImage(mezzaImg);
      tex = texInfo.tex;
      aspect = texInfo.w / texInfo.h;
    }

    // Plane height relative to egg size (tweakable).
    // Egg radius ~1, height ~2.3 after scale. We’ll fit Mezza comfortably inside.
    const planeH = 1.85;
    const planeW = planeH * aspect;

    const geo = new THREE.PlaneGeometry(planeW, planeH, 1, 1);
    mezzaGroup = new THREE.Group();
    mezzaGroup.position.set(-0.01, 0, 0.0005);
    scene.add(mezzaGroup);

    if (tex) {
      const mat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        opacity: 1.0,
        side: THREE.DoubleSide,
        depthTest: true,
        depthWrite: false,
      });
      mezzaPlane = new THREE.Mesh(geo, mat);
      mezzaPlane.position.set(0, 0, 0);
      mezzaGroup.add(mezzaPlane);
    }

    const shardUrls = Array.from({ length: 14 }, (_, i) => `./images/shard_${i + 1}.png`);
    const texLoader = new THREE.TextureLoader();
    const loadTexture = (url) => new Promise((resolve, reject) => {
      texLoader.load(
        url,
        (texture) => {
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          resolve(texture);
        },
        undefined,
        reject
      );
    });

    const shardTextures = await Promise.all(shardUrls.map(loadTexture));
    shardTextures.forEach((shardTex, i) => {
      const shardMat = new THREE.MeshBasicMaterial({
        map: shardTex,
        transparent: true,
        opacity: 1.0,
        side: THREE.DoubleSide,
        depthTest: true,
        depthWrite: false,
      });
      const shardMesh = new THREE.Mesh(geo.clone(), shardMat);
      shardMesh.position.set(0, 0, 0.0001 + i * 0.00002);
      mezzaGroup.add(shardMesh);
      shardPlanes.push(shardMesh);

      const angle = Math.random() * Math.PI * 2;
      const baseAmpPx = 5 + Math.random() * 2;
      const ampPx = (i === 9 || i === 13) ? baseAmpPx * 0.5 : baseAmpPx;
      const speed = mediumShardSpeed * (0.85 + Math.random() * 0.3); // slightly slower/faster than medium
      shardMotion.push({
        dirX: Math.cos(angle),
        dirY: Math.sin(angle),
        ampPx,
        scalar: Math.random() * 2 - 1,
        scalarDir: Math.random() < 0.5 ? -1 : 1,
        speed,
      });
    });
  }

  buildMezzaPlane().catch((err) => {
    console.error(err);
  });

  // --- Animation ---
  let t = 0;
  let lastFrameMs = performance.now();
  const tmpCamPos = new THREE.Vector3();
  const tmpMezzaPos = new THREE.Vector3();
  function animate() {
    t += 0.01;
    const nowMs = performance.now();
    const dt = Math.min(0.05, Math.max(0.001, (nowMs - lastFrameMs) / 1000));
    lastFrameMs = nowMs;

    // Constant spin around vertical axis.
    shell.rotation.y += 0.01;
    // Keep the clipping plane rotating with the shell and centered on shell origin.
    halfCut.normal.set(1, 0, 0).applyQuaternion(shell.quaternion);
    halfCut.constant = -halfCut.normal.dot(shell.position);

    // If you ever want the plane to stay world-still while the egg rotates around it,
    // leave plane rotation at 0 (default). That keeps it as a “cut” through the egg.
    if (mezzaGroup && shardPlanes.length > 0) {
      camera.getWorldPosition(tmpCamPos);
      mezzaGroup.getWorldPosition(tmpMezzaPos);
      const depth = Math.max(0.001, tmpCamPos.distanceTo(tmpMezzaPos));
      const viewHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * depth;
      const worldPerPixel = viewHeight / Math.max(1, renderer.domElement.clientHeight);

      for (let i = 0; i < shardPlanes.length; i += 1) {
        const m = shardMotion[i];
        const shard = shardPlanes[i];
        m.scalar += m.scalarDir * m.speed * dt;
        if (m.scalar >= 1) {
          m.scalar = 1;
          m.scalarDir = -1;
          m.speed = mediumShardSpeed * (0.85 + Math.random() * 0.3);
        } else if (m.scalar <= -1) {
          m.scalar = -1;
          m.scalarDir = 1;
          m.speed = mediumShardSpeed * (0.85 + Math.random() * 0.3);
        }
        const offset = m.scalar * m.ampPx * worldPerPixel;
        shard.position.x = m.dirX * offset;
        shard.position.y = m.dirY * offset;
      }
    }

    // controls?.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();

  // --- Resize ---
  window.addEventListener("resize", () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });
</script>

</body>
</html>
